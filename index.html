<html lang="th">
<head>
<meta charset="utf-8">

<title>KidPrint Studio · สร้างสมุดระบายสีและใบงานเด็กเพื่อขาย</title>
<meta name="description" content="สร้างสมุดระบายสี ใบงานฝึกเขียน คณิต เขาวงกต ค้นหาคำ แบบพร้อมพิมพ์ รวมเล่ม PDF สำหรับ Etsy และ Amazon KDP พร้อมตัวช่วยทำภาพสินค้า เขียนประกาศขาย วางแผนรายได้ และผู้ช่วยตอบคำถาม">
<meta name="theme-color" content="#1C2340">
<meta property="og:title" content="KidPrint Studio">
<meta property="og:description" content="สร้างสมุดระบายสีและใบงานเด็ก พร้อมขายบน Etsy, Amazon KDP และตลาดไทย">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect x='3' y='3' width='38' height='38' rx='11' fill='%23FFC93C'/%3E%3Cpath d='M12 31l3.5-.8 13-13-2.7-2.7-13 13z' fill='%231C2340'/%3E%3Cpath d='M27.3 13.1l2.7 2.7 2-2a1.9 1.9 0 000-2.7 1.9 1.9 0 00-2.7 0z' fill='%23E5484D'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Mali:wght@500;600;700&family=Mitr:wght@500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* =========================================================
   KidPrint Studio — UI styles
   Desk = green cutting mat; everything else quiet paper-gray.
   ========================================================= */
:root{
  --ink:#1C2340; --ink2:#48506E; --ink3:#858BA3; --line:#DCE0EA; --line2:#E9ECF3;
  --bg:#EEF1F6; --panel:#fff; --soft:#F6F7FB;
  --mat:#2B5A54; --mat2:#24504A; --matline:rgba(255,255,255,.07); --matline2:rgba(255,255,255,.15);
  --yellow:#FFC93C; --yellow2:#F0B21B;
  --c-color:#2F6FEB; --c-write:#12936A; --c-math:#E07A00; --c-puzzle:#7A4BD8; --c-page:#D33F78;
  --ok:#12936A; --warn:#C77700; --bad:#C8352D;
  --ui:'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif;
  --display:'Mali', 'IBM Plex Sans Thai', sans-serif;
  --r1:6px; --r2:10px; --r3:16px;
  --shadow:0 1px 2px rgba(28,35,64,.06), 0 8px 24px -12px rgba(28,35,64,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.6 var(--ui);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--c-color)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.25;margin:0}
h2{font-size:22px} h3{font-size:17px}
.muted{color:var(--ink3)} .small{font-size:13px}
.app{display:grid;grid-template-columns:78px 1fr;height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:2px;z-index:5}
.rail .mark{width:44px;height:44px;margin-bottom:14px;display:grid;place-items:center}
.rail a,.rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;width:66px;padding:9px 2px 8px;border-radius:12px;color:#B9BFD4;font-size:11.5px;line-height:1.2;text-align:center}
.rail a svg,.rail button svg{width:23px;height:23px}
.rail a:hover,.rail button:hover{color:#fff;background:rgba(255,255,255,.06)}
.rail a.on{color:#fff;background:rgba(255,255,255,.1)}
.rail a.on svg{color:var(--yellow)}
.rail .sp{flex:1}
.rail a:focus-visible,.rail button:focus-visible{outline:3px solid var(--yellow)}

main{overflow:auto;position:relative}
.view{display:none;min-height:100%}
.view.on{display:block}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn svg{width:17px;height:17px;flex:none}
.btn.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ink:hover{background:#2A3358}
.btn.cta{background:var(--yellow);border-color:var(--yellow2);color:var(--ink);font-weight:600;border-radius:999px;padding:10px 18px}
.btn.cta:hover{background:#FFD25F}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:7px}
.btn.icon{padding:6px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:4px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:14px}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5}
.inp:focus{border-color:var(--c-color);outline:none;box-shadow:0 0 0 3px rgba(47,111,235,.15)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin:0 0 12px;cursor:pointer}
.chk input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--ink)}
.range{display:flex;gap:10px;align-items:center}
.range input{flex:1;accent-color:var(--ink)}
.range b{min-width:26px;text-align:right;font-weight:600}
.hint{font-size:12.5px;color:var(--ink3);margin:-6px 0 12px}
.box{background:var(--soft);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:13.5px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line2);color:var(--ink2)}
.tag.ok{background:#E6F5EF;border-color:#BFE5D5;color:#0E7553}
.tag.warn{background:#FFF4DE;border-color:#F3D9A3;color:#8A5600}
.tag.bad{background:#FDECEA;border-color:#F3C3BE;color:#A3271F}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:340px minmax(0,1fr) 292px;grid-template-rows:minmax(0,1fr);height:100vh}
.pane{background:var(--panel);overflow:auto;display:flex;flex-direction:column}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line)}
.pane-h{padding:16px 16px 8px}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.cat{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13.5px;padding:5px 11px 5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.cat i{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.cat:hover{border-color:var(--cc)}
.cat.on{background:var(--cc);border-color:var(--cc);color:#fff}
.cat.on i{background:#fff}
.gens{padding:0 10px 6px;display:flex;flex-direction:column;gap:2px}
.gen{all:unset;cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;border-left:3px solid transparent}
.gen:hover{background:var(--soft)}
.gen.on{background:var(--soft);border-left-color:var(--cc)}
.gen .ic{width:38px;height:38px;border-radius:9px;background:color-mix(in srgb,var(--cc) 12%,#fff);color:var(--cc);display:grid;place-items:center;font-weight:700;font-size:15px;overflow:hidden}
.gen .ic svg{width:34px;height:34px}
.gen b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.gen small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.35}
.form{padding:14px 16px 4px;border-top:1px solid var(--line2)}
.form h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
details.more{border-top:1px solid var(--line2);padding:10px 16px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px;color:var(--ink2)}
details.more[open] summary{margin-bottom:12px}
.actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.actions .row{flex-wrap:nowrap}
.batch{display:flex;align-items:center;gap:6px}
.batch input{width:62px}

.desk{position:relative;display:flex;flex-direction:column;background-color:var(--mat);
  background-image:linear-gradient(var(--matline2) 1px,transparent 1px),linear-gradient(90deg,var(--matline2) 1px,transparent 1px),linear-gradient(var(--matline) 1px,transparent 1px),linear-gradient(90deg,var(--matline) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:-1px -1px}
.desk-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#DDE9E6;font-size:13px;flex-wrap:wrap}
.desk-bar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.desk-bar .btn:hover{background:rgba(255,255,255,.18)}
.desk-bar .btn.on{background:var(--yellow);border-color:var(--yellow2);color:var(--ink)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 26px 26px;overflow:auto}
.paper{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15),0 18px 40px -16px rgba(0,0,0,.55);max-height:100%;max-width:100%;position:relative}
.paper svg{display:block;width:100%;height:100%}
.paper.busy::after{content:'กำลังสร้าง…';position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);font-weight:600}
.editing{margin:0 14px;background:var(--yellow);color:var(--ink);border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:13.5px}
.editing b{font-weight:600}

.book-h{padding:16px 14px 10px;border-bottom:1px solid var(--line2)}
.book-h input{font-family:var(--display);font-weight:600;font-size:17px;border:1px solid transparent;border-radius:8px;padding:4px 6px;width:100%;margin-left:-6px}
.book-h input:hover{border-color:var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pages{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.pg{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;padding:6px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:#fff}
.pg:hover{border-color:var(--line)}
.pg.sel{border-color:var(--ink);background:var(--soft)}
.pg.drag{opacity:.4}
.pg.over{box-shadow:inset 0 3px 0 var(--yellow)}
.pg img{width:54px;border:1px solid var(--line);border-radius:3px;background:#fff;display:block}
.pg .t{min-width:0}
.pg .t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .t small{color:var(--ink3);font-size:12px}
.pg .ops{display:grid;grid-template-columns:repeat(2,22px);gap:2px;opacity:0}
.pg:hover .ops,.pg.sel .ops,.pg:focus-within .ops{opacity:1}
.pg .ops button{all:unset;cursor:pointer;width:22px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--ink2)}
.pg .ops button:hover{background:var(--line2)}
.pg .ops svg{width:14px;height:14px}
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:64px;height:64px;color:#C9CEDC;display:block;margin:0 auto 8px}
.export{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:#fff}
.export .btn{width:100%}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,26,48,.45);z-index:40;display:grid;place-items:center;padding:18px}
.modal{background:#fff;border-radius:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);width:min(680px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column}
.modal.wide{width:min(1060px,100%)}
.modal.side{position:fixed;right:0;top:0;bottom:0;border-radius:0;width:min(420px,100%);max-height:none}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line2)}
.modal-h h2{font-size:20px;flex:1}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:520px}
.toast.ok{background:#0E7553} .toast.bad{background:#A3271F}

/* ---------- generic page layout (non-studio views) ---------- */
.page{max-width:1180px;margin:0 auto;padding:30px 28px 70px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font-size:30px}
.page-h p{margin:4px 0 0;color:var(--ink2);max-width:62ch}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r3);padding:18px}
.panel h3{margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.sticky{position:sticky;top:18px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;align-items:center;margin-bottom:34px}
.hero h1{font-size:44px;line-height:1.15;letter-spacing:-.01em}
.hero p{font-size:17px;color:var(--ink2);max-width:46ch;margin:14px 0 22px}
.hero-desk{border-radius:22px;aspect-ratio:5/4;position:relative;overflow:hidden;background-color:var(--mat);
  background-image:linear-gradient(var(--matline2) 1px,transparent 1px),linear-gradient(90deg,var(--matline2) 1px,transparent 1px),linear-gradient(var(--matline) 1px,transparent 1px),linear-gradient(90deg,var(--matline) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px}
.hero-desk .sheet{position:absolute;width:38%;aspect-ratio:8.5/11;background:#fff;box-shadow:0 16px 30px -12px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.hero-desk .sheet img,.hero-desk .sheet svg{width:100%;height:100%;display:block}
.hero-desk .s1{left:9%;top:16%;transform:rotate(-8deg)} .hero-desk .s2{left:31%;top:9%;transform:rotate(1deg);z-index:2} .hero-desk .s3{left:53%;top:17%;transform:rotate(7deg)}
.hero-desk:hover .s1{transform:rotate(-11deg) translateX(-8px)} .hero-desk:hover .s3{transform:rotate(10deg) translateX(8px)}
.hero-desk .crayon{position:absolute;z-index:3}
@media (prefers-reduced-motion:reduce){.hero-desk .sheet{transition:none}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r3);margin-bottom:34px;overflow:hidden}
.step{all:unset;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;border-right:1px solid var(--line2)}
.step:last-child{border-right:0}
.step:hover{background:var(--soft)}
.step .n{grid-row:span 2;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.step b{font-size:16px} .step span{color:var(--ink2);font-size:14px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.sec-h h2{font-size:24px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:22px 18px;margin-bottom:38px}
.preset{all:unset;cursor:pointer;display:block}
.preset .cover{position:relative;aspect-ratio:8.5/11;margin:0 10px 12px 0}
.preset .cover::before,.preset .cover::after{content:'';position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:3px}
.preset .cover::before{transform:translate(10px,8px)} .preset .cover::after{transform:translate(5px,4px)}
.preset .cover img,.preset .cover .cv{position:relative;z-index:1;width:100%;height:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:0 6px 14px -8px rgba(28,35,64,.4);transition:transform .2s;overflow:hidden}
.preset .cover .cv svg{width:100%;height:100%;display:block}
.preset:hover .cover img,.preset:hover .cover .cv{transform:translateY(-4px) rotate(-1deg)}
@media (prefers-reduced-motion:reduce){.preset .cover .cv,.preset .cover img{transition:none}}
.preset b{display:block;font-size:15px;line-height:1.35}
.preset small{display:block;color:var(--ink3);font-size:13px;margin-top:2px}
.preset .mk{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

/* ---------- mockup ---------- */
.mk-stage{border-radius:var(--r3);padding:22px;display:grid;place-items:center;background-color:var(--mat);
  background-image:linear-gradient(var(--matline) 1px,transparent 1px),linear-gradient(90deg,var(--matline) 1px,transparent 1px);background-size:24px 24px;min-height:420px}
.mk-stage canvas{max-width:100%;max-height:72vh;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);background:#fff}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sw{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:12px}
.tpl button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:13px;text-align:center}
.tpl button.on{border-color:var(--ink);background:var(--soft);font-weight:600}

/* ---------- listing ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.field-out{margin-bottom:16px}
.field-out .fh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.field-out .fh b{font-size:14px}
.field-out .fh .cnt{font-size:12px;color:var(--ink3)}
.field-out .fh .cnt.over{color:var(--bad);font-weight:600}
.field-out textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.55 var(--ui);background:#fff;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.chips span.over{border-color:var(--bad);color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2)}
table.t th{font-weight:600;color:var(--ink2);font-size:13px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- money ---------- */
.big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:var(--line2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:13px;color:var(--ink2);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.season{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.season:last-child{border-bottom:0}
.season .d{font-family:var(--display);font-weight:700;text-align:center;line-height:1.05}
.season .d small{display:block;font-family:var(--ui);font-weight:500;font-size:11px;color:var(--ink3)}
.road{counter-reset:wk}
.road li{list-style:none;margin:0 0 10px;padding:0}
.road label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.road input{margin-top:4px;width:17px;height:17px;accent-color:var(--ok)}
.road .wk{font-size:12px;color:var(--ink3);font-weight:600}

/* ---------- guides ---------- */
.gl{display:flex;flex-direction:column;gap:4px}
.gl button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:500}
.gl button:hover{background:#fff}
.gl button.on{background:#fff;box-shadow:inset 3px 0 0 var(--ink)}
.gl .pr{margin-left:auto;font-size:12px;color:var(--ink3)}
.guide h2{font-size:26px;margin-bottom:6px}
.guide .intro{color:var(--ink2);margin:0 0 18px;max-width:70ch}
.gstep{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line2)}
.gstep .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.gstep.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.gstep h4{margin:3px 0 4px;font-size:16px;font-weight:600}
.gstep p{margin:0 0 6px;color:var(--ink2);max-width:72ch}
.gstep ul{margin:4px 0 6px;padding-left:20px;color:var(--ink2)}
.gstep .links{display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px}
.callout{border-left:4px solid var(--yellow2);background:#FFF8E6;padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0;font-size:14.5px}
.callout.blue{border-color:var(--c-color);background:#EEF3FE}
.src{font-size:12.5px;color:var(--ink3);margin-top:18px}

/* ---------- chat ---------- */
#chatBtn{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 18px 12px 14px;box-shadow:0 12px 30px -10px rgba(28,35,64,.6);cursor:pointer;font-weight:600}
#chatBtn svg{width:22px;height:22px;color:var(--yellow)}
#chat{position:fixed;right:20px;bottom:20px;z-index:31;width:min(400px,calc(100vw - 24px));height:min(620px,calc(100vh - 40px));background:#fff;border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
#chat.on{display:flex}
@media (min-width:1181px){body[data-view=studio] #chatBtn{right:312px}body[data-view=studio] #chat{right:312px}}
.ch-h{background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ch-h b{font-family:var(--display);font-size:17px;font-weight:600}
.ch-h small{display:block;color:#B9BFD4;font-size:12px}
.ch-h .btn{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
.ch-log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:normal;overflow-wrap:anywhere}
.msg.bot{background:#fff;border:1px solid var(--line2);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.msg p{margin:0 0 6px} .msg p:last-child{margin:0}
.msg ul,.msg ol{margin:4px 0 6px;padding-left:20px}
.msg a{color:var(--c-color)}
.msg.me a{color:var(--yellow)}
.msg .src{margin-top:6px;font-size:11.5px}
.qr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:100%}
.qr button{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink)}
.qr button:hover{border-color:var(--ink)}
.qr button.act{background:#FFF3CF;border-color:var(--yellow2)}
.ch-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
.ch-in textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 11px;resize:none;height:42px;max-height:120px;font-size:14.5px}
.typing{display:inline-flex;gap:4px} .typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .studio{grid-template-columns:310px minmax(0,1fr)}
  .pane.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}
  .studio{height:auto;min-height:100vh;grid-template-rows:auto}
  .desk{min-height:78vh}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{flex-direction:row;order:2;padding:4px 6px;justify-content:space-around;overflow-x:auto}
  .rail .mark,.rail .sp{display:none}
  .rail a,.rail button{width:auto;min-width:56px;font-size:10.5px;padding:6px 4px}
  main{height:calc(100vh - 62px)}
  .studio{grid-template-columns:1fr}
  .pane.left{border-right:0}
  .desk{min-height:82vh}
  .hero,.split{grid-template-columns:1fr}
  .hero h1{font-size:34px}
  .steps{grid-template-columns:1fr}
  .step{border-right:0;border-bottom:1px solid var(--line2)}
  .grid2{grid-template-columns:1fr}
  .page{padding:20px 16px 90px}
  #chatBtn{bottom:78px} #chat{bottom:74px;height:min(600px,calc(100vh - 100px))}
}
@media print{body>*{display:none!important}}

/* =========================================================

   ========================================================= */
(function () {
'use strict';
const KP = window.KP = window.KP || {};
const U = KP.U = 96;                       // SVG units per inch
const f = KP.f = v => Math.round(v * 100) / 100;
const esc = KP.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
KP.$ = (s, r = document) => r.querySelector(s);
KP.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
KP.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
KP.uid = () => Math.random().toString(36).slice(2, 9);
KP.newSeed = () => Math.floor(Math.random() * 2147483000) + 1;
KP.clone = o => JSON.parse(JSON.stringify(o));
KP.sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- seeded random ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
KP.rng = seed => {
  const r = mulberry32((seed >>> 0) || 1);
  const o = () => r();
  o.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  o.range = (a, b) => a + r() * (b - a);
  o.pick = a => a[Math.floor(r() * a.length)];

  o.shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; };
  return o;
};

/* ---------- DOM builder ---------- */
KP.h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(k)); }

};

/* ---------- storage ---------- */
KP.store = {
  get(k, d) { try { const v = localStorage.getItem('kps.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kps.' + k, JSON.stringify(v)); return true; } catch (e) { console.warn('storage', e); return false; } }
};

/* ---------- fonts ---------- */
KP.F = {
  th: "'Sarabun', 'Noto Sans Thai', sans-serif",
  en: "'Andika', 'Sarabun', sans-serif",
  kidTh: "'Mali', 'Sarabun', sans-serif",
  kidEn: "'Fredoka', 'Mali', sans-serif",
  bubbleEn: "'Fredoka', 'Mitr', sans-serif",
  bubbleTh: "'Sarabun', sans-serif"
};
KP.F.title = lang => lang === 'th' ? KP.F.kidTh : KP.F.kidEn;
KP.F.body = lang => lang === 'th' ? KP.F.th : KP.F.en;
KP.isThai = s => /[฀-๿]/.test(s || '');
KP.FONT_PAGE = 'https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Mali:wght@500;600;700&family=Mitr:wght@500;600&family=Sarabun:wght@400;600;700&display=swap';
KP.FONT_UI = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap';

/* ---------- text helpers ---------- */
KP.txt = (x, y, s, o = {}) =>
  `<text x="${f(x)}" y="${f(y)}" font-family="${o.font || KP.F.kidEn}" font-size="${f(o.size || 16)}"` +
  (o.weight ? ` font-weight="${o.weight}"` : '') + ` text-anchor="${o.anchor || 'start'}"` +
  ` fill="${o.fill === undefined ? '#111' : o.fill}"` +
  (o.stroke ? ` stroke="${o.stroke}" stroke-width="${f(o.sw || 1)}" stroke-linejoin="round" stroke-linecap="round"` : '') +
  (o.dash ? ` stroke-dasharray="${o.dash}"` : '') + (o.paint ? ' paint-order="stroke"' : '') +
  (o.ls ? ` letter-spacing="${o.ls}"` : '') + (o.extra || '') + `>${esc(s)}</text>`;

let _mc = null;
KP.measure = (s, size, font, weight = 400) => {
  try {
    if (!_mc) _mc = document.createElement('canvas').getContext('2d');
    _mc.font = `${weight} ${size}px ${font}`;
    return _mc.measureText(String(s)).width;
  } catch (e) { return String(s).length * size * 0.56; }
};
KP.fitSize = (s, maxW, size, font, weight, min = 8) => {
  let sz = size;
  while (sz > min && KP.measure(s, sz, font, weight) > maxW) sz -= 1;
  return sz;
};
KP.segWords = s => {
  if (KP.isThai(s) && window.Intl && Intl.Segmenter) return Array.from(new Intl.Segmenter('th', { granularity: 'word' }).segment(s), x => x.segment);
  return String(s).split(/(\s+)/);
};
KP.wrap = (s, maxW, size, font, weight) => {
  const lines = [];
  for (const para of String(s || '').split('\n')) {
    let line = '';
    for (const t of KP.segWords(para)) {
      const test = line + t;
      if (line.trim() && KP.measure(test.trim(), size, font, weight) > maxW) { lines.push(line.trim()); line = t.replace(/^\s+/, ''); }
      else line = test;
    }
    lines.push(line.trim());
  }
  return lines;
};
KP.graphemes = s => {
  if (window.Intl && Intl.Segmenter) return Array.from(new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(s), x => x.segment);
  const out = [];
  for (const ch of s) { if (/[ัำ-ฺ็-๎]/.test(ch) && out.length) out[out.length - 1] += ch; else out.push(ch); }
  return out;
};

/* ---------- shapes (return path data) ---------- */
const S = KP.shape = {
  star(cx, cy, r, ri, n = 5, rot = -Math.PI / 2) {
    ri = ri == null ? r * 0.45 : ri; let d = '';
    for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? ri : r, a = rot + i * Math.PI / n; d += (i ? 'L' : 'M') + f(cx + rr * Math.cos(a)) + ' ' + f(cy + rr * Math.sin(a)); }
    return d + 'Z';
  },
  heart(cx, cy, r) {
    const s = r / 82, P = (x, y) => f(cx + (x - 100) * s) + ' ' + f(cy + (y - 105) * s);
    return `M${P(100, 180)}C${P(40, 140)} ${P(15, 105)} ${P(20, 70)}C${P(25, 40)} ${P(55, 28)} ${P(75, 35)}C${P(88, 40)} ${P(96, 50)} ${P(100, 60)}C${P(104, 50)} ${P(112, 40)} ${P(125, 35)}C${P(145, 28)} ${P(175, 40)} ${P(180, 70)}C${P(185, 105)} ${P(160, 140)} ${P(100, 180)}Z`;
  },
  circle(cx, cy, r) { return `M${f(cx - r)} ${f(cy)}A${f(r)} ${f(r)} 0 1 0 ${f(cx + r)} ${f(cy)}A${f(r)} ${f(r)} 0 1 0 ${f(cx - r)} ${f(cy)}Z`; },
  oval(cx, cy, rx, ry) { return `M${f(cx - rx)} ${f(cy)}A${f(rx)} ${f(ry)} 0 1 0 ${f(cx + rx)} ${f(cy)}A${f(rx)} ${f(ry)} 0 1 0 ${f(cx - rx)} ${f(cy)}Z`; },
  poly(cx, cy, r, n, rot = -Math.PI / 2) { let d = ''; for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; d += (i ? 'L' : 'M') + f(cx + r * Math.cos(a)) + ' ' + f(cy + r * Math.sin(a)); } return d + 'Z'; },
  rect(x, y, w, h, r = 0) {
    if (!r) return `M${f(x)} ${f(y)}H${f(x + w)}V${f(y + h)}H${f(x)}Z`;
    r = Math.min(r, w / 2, h / 2);
    return `M${f(x + r)} ${f(y)}H${f(x + w - r)}A${f(r)} ${f(r)} 0 0 1 ${f(x + w)} ${f(y + r)}V${f(y + h - r)}A${f(r)} ${f(r)} 0 0 1 ${f(x + w - r)} ${f(y + h)}H${f(x + r)}A${f(r)} ${f(r)} 0 0 1 ${f(x)} ${f(y + h - r)}V${f(y + r)}A${f(r)} ${f(r)} 0 0 1 ${f(x + r)} ${f(y)}Z`;
  },
  diamond(cx, cy, w, h) { return `M${f(cx)} ${f(cy - h / 2)}L${f(cx + w / 2)} ${f(cy)}L${f(cx)} ${f(cy + h / 2)}L${f(cx - w / 2)} ${f(cy)}Z`; },
  flower(cx, cy, r, n = 6) {
    let d = ''; const ri = r * 0.6;
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n, am = (a0 + a1) / 2;
      if (!i) d += 'M' + f(cx + ri * Math.cos(a0)) + ' ' + f(cy + ri * Math.sin(a0));
      d += 'Q' + f(cx + r * 1.32 * Math.cos(am)) + ' ' + f(cy + r * 1.32 * Math.sin(am)) + ' ' + f(cx + ri * Math.cos(a1)) + ' ' + f(cy + ri * Math.sin(a1));
    }
    return d + 'Z';
  },
  cloud(cx, cy, w) {
    const s = w / 100, P = (x, y) => f(cx + x * s) + ' ' + f(cy + y * s);
    return `M${P(-40, 18)}C${P(-58, 18)} ${P(-58, -6)} ${P(-40, -6)}C${P(-40, -26)} ${P(-14, -30)} ${P(-6, -14)}C${P(2, -34)} ${P(34, -30)} ${P(32, -8)}C${P(52, -10)} ${P(56, 18)} ${P(36, 18)}Z`;
  },
  moon(cx, cy, r) {
    const P = (x, y) => f(cx + x * r) + ' ' + f(cy + y * r);
    return `M${P(0.2, -1)}A${f(r)} ${f(r)} 0 1 0 ${P(0.2, 1)}A${f(r * 0.78)} ${f(r * 0.78)} 0 1 1 ${P(0.2, -1)}Z`;
  }
};

/* ---------- path flatten / resample (for dot-to-dot, maze masks) ---------- */
KP.flatten = d => {
  const tok = String(d).match(/[MLHVQCZ]|-?\d*\.?\d+(?:e-?\d+)?/gi) || [];
  const pts = []; let i = 0, cmd = '', x = 0, y = 0;
  const num = () => parseFloat(tok[i++]);
  while (i < tok.length) {
    if (/[A-Za-z]/.test(tok[i])) cmd = tok[i++].toUpperCase();
    if (cmd === 'Z') { continue; }
    if (cmd === 'M' || cmd === 'L') { x = num(); y = num(); pts.push([x, y]); if (cmd === 'M') cmd = 'L'; }
    else if (cmd === 'H') { x = num(); pts.push([x, y]); }
    else if (cmd === 'V') { y = num(); pts.push([x, y]); }
    else if (cmd === 'Q') { const x1 = num(), y1 = num(), x2 = num(), y2 = num(); for (let k = 1; k <= 12; k++) { const t = k / 12, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t; pts.push([a * x + b * x1 + c * x2, a * y + b * y1 + c * y2]); } x = x2; y = y2; }
    else if (cmd === 'C') { const x1 = num(), y1 = num(), x2 = num(), y2 = num(), x3 = num(), y3 = num(); for (let k = 1; k <= 16; k++) { const t = k / 16, a = (1 - t) ** 3, b = 3 * (1 - t) ** 2 * t, c = 3 * (1 - t) * t * t, e = t ** 3; pts.push([a * x + b * x1 + c * x2 + e * x3, a * y + b * y1 + c * y2 + e * y3]); } x = x3; y = y3; }
    else i++;
  }
  // drop closing duplicate
  const a = pts[0], b = pts[pts.length - 1];
  if (pts.length > 2 && Math.hypot(a[0] - b[0], a[1] - b[1]) < 0.01) pts.pop();
  return pts;
};
KP.polyArea = pts => { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
KP.inPoly = (x, y, pts) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if (((a[1] > y) !== (b[1] > y)) && (x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0])) c = !c; } return c; };
KP.resample = (pts0, N) => {
  let pts = pts0.slice();
  if (KP.polyArea(pts) < 0) pts.reverse();                 // clockwise on screen
  const n = pts.length;
  const segL = [], pos = []; let L = 0;
  for (let i = 0; i < n; i++) { pos.push(L); const a = pts[i], b = pts[(i + 1) % n]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); segL.push(l); L += l; }
  const turn = i => { const a = pts[(i - 1 + n) % n], p = pts[i], b = pts[(i + 1) % n]; const v1 = [p[0] - a[0], p[1] - a[1]], v2 = [b[0] - p[0], b[1] - p[1]]; return Math.abs(Math.atan2(v1[0] * v2[1] - v1[1] * v2[0], v1[0] * v2[0] + v1[1] * v2[1])); };
  let corners = [];
  for (let i = 0; i < n; i++) if (turn(i) > 0.62) corners.push(i);
  if (corners.length > N) { const step = corners.length / N; corners = Array.from({ length: N }, (_, k) => corners[Math.floor(k * step)]); }
  // start at top-most corner (or top-most point)
  let startIdx = 0;
  if (corners.length) { startIdx = corners.reduce((best, c) => pts[c][1] < pts[best][1] - 0.5 ? c : best, corners[0]); }
  else { for (let i = 1; i < n; i++) if (pts[i][1] < pts[startIdx][1]) startIdx = i; corners = [startIdx]; }
  corners.sort((a, b) => ((pos[a] - pos[startIdx] + L) % L) - ((pos[b] - pos[startIdx] + L) % L));
  const cpos = corners.map(c => (pos[c] - pos[startIdx] + L) % L);
  const extra = Math.max(0, N - corners.length);
  const secs = cpos.map((p, k) => ((k + 1 < cpos.length ? cpos[k + 1] : L) - p));
  let alloc = secs.map(s => Math.floor(extra * s / L));
  let rem = extra - alloc.reduce((a, b) => a + b, 0);
  const order = secs.map((s, k) => [s / (alloc[k] + 1), k]).sort((a, b) => b[0] - a[0]);
  for (let q = 0; rem > 0; q++, rem--) alloc[order[q % order.length][1]]++;
  const at = s => { s = ((s % L) + L) % L; s = (s + pos[startIdx]) % L; let i = 0; while (i < n - 1 && pos[i + 1] <= s) i++; const t = segL[i] ? (s - pos[i]) / segL[i] : 0; const a = pts[i], b = pts[(i + 1) % n]; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; };
  const out = [];
  cpos.forEach((p, k) => { out.push(at(p)); const m = alloc[k]; for (let j = 1; j <= m; j++) out.push(at(p + secs[k] * j / (m + 1))); });
  return out;
};

function borderSVG(type, x, y, w, h) {

  const p = d => `<path d="${d}"/>`;

    case 'thin': return g(p(S.rect(x, y, w, h)), 1.5);
    case 'round': return g(p(S.rect(x, y, w, h, 22)), 3);
    case 'double': return g(p(S.rect(x, y, w, h, 6)) + p(S.rect(x + 7, y + 7, w - 14, h - 14, 3)), 1.8);
    case 'dash': return `<path d="${S.rect(x, y, w, h, 18)}" fill="none" stroke="#111" stroke-width="2.4" stroke-dasharray="10 8" stroke-linecap="round"/>`;
    case 'dots': {
      let s = ''; const gap = 16;
      const nx = Math.round(w / gap), ny = Math.round(h / gap);
      for (let i = 0; i <= nx; i++) { s += `<circle cx="${f(x + i * w / nx)}" cy="${f(y)}" r="3.2"/><circle cx="${f(x + i * w / nx)}" cy="${f(y + h)}" r="3.2"/>`; }

      return `<g fill="#111">${s}</g>`;
    }
    case 'scallop': {
      const r = 11, nx = Math.max(4, Math.round(w / (2 * r))), ny = Math.max(4, Math.round(h / (2 * r)));
      const sx = w / nx, sy = h / ny; let d = `M${f(x)} ${f(y)}`;
      for (let i = 0; i < nx; i++) d += `A${f(sx / 2)} ${f(sx / 2)} 0 0 1 ${f(x + (i + 1) * sx)} ${f(y)}`;
      for (let j = 0; j < ny; j++) d += `A${f(sy / 2)} ${f(sy / 2)} 0 0 1 ${f(x + w)} ${f(y + (j + 1) * sy)}`;
      for (let i = nx - 1; i >= 0; i--) d += `A${f(sx / 2)} ${f(sx / 2)} 0 0 1 ${f(x + i * sx)} ${f(y + h)}`;
      for (let j = ny - 1; j >= 0; j--) d += `A${f(sy / 2)} ${f(sy / 2)} 0 0 1 ${f(x)} ${f(y + j * sy)}`;

    }
  }

}

KP.renderPage = (page, S, o = {}) => {
  const gen = KP.GENS[page.gen];

  const p = Object.assign(KP.defaultParams(gen), page.params || {});
  const lang = p._lang && p._lang !== 'auto' ? p._lang : (gen.langKey && p[gen.langKey]) || S.lang || 'en';
  const L = (th, en) => lang === 'th' ? th : en;
  const m = (S.margin ?? 0.5) * U;
  const tw = d.tw, th = d.th;
  let mode = p._header && p._header !== 'auto' ? p._header : (S.header && S.header !== 'auto' ? S.header : (gen.header || 'full'));
  if (gen.header === 'never') mode = 'none';

  }

  if (mode === 'full' || mode === 'title') {
    if (mode === 'full' && S.nameLine && !o.answer) {
      const fs = 13.5, ny = y + 12;
      const l1 = L('ชื่อ', 'Name') + ':', l2 = L('วันที่', 'Date') + ':';
      const w1 = KP.measure(l1, fs, BF, 600) + 6, w2 = KP.measure(l2, fs, BF, 600) + 6;
      const dateW = area.w * 0.3;
      out += KP.txt(area.x, ny, l1, { size: fs, font: BF, weight: 600, fill: '#333' });
      out += `<line x1="${f(area.x + w1)}" y1="${f(ny + 3)}" x2="${f(area.x + area.w - dateW - 18)}" y2="${f(ny + 3)}" stroke="#555" stroke-width="1"/>`;
      const dx = area.x + area.w - dateW;
      out += KP.txt(dx, ny, l2, { size: fs, font: BF, weight: 600, fill: '#333' });
      out += `<line x1="${f(dx + w2)}" y1="${f(ny + 3)}" x2="${f(area.x + area.w)}" y2="${f(ny + 3)}" stroke="#555" stroke-width="1"/>`;
      y += 30;
    }
    let title = (p._title || '').trim() || (gen.title ? gen.title(p, L) : '');
    if (o.answer) title = L('เฉลย · ', 'Answer Key · ') + title;
    if (title) {
      const fs = KP.fitSize(title, area.w, o.mini ? 26 : 30, TF, 600, 14);
      out += KP.txt(area.x + area.w / 2, y + fs * 0.92, title, { size: fs, font: TF, weight: 600, anchor: 'middle' });
      y += fs + 8;
    }

      out += KP.txt(area.x + area.w / 2, y + fs, instr, { size: fs, font: BF, fill: '#444', anchor: 'middle' });

  }

  const seed = page.seed || 1;
  let cnt = 0;
  const ctx = {
    W: tw, H: th, box, area, lang, L, BF, TF, rng: KP.rng(seed), seed,
    lw: S.lw || 1, answer: !!o.answer, S, page,
    uid: () => 'k' + String(page.id || 'x').replace(/[^\w]/g, '') + (o.answer ? 'a' : '') + (o.mini ? 'm' : '') + '_' + (cnt++)
  };

  return { svg, content, W: d.W, H: d.H, tw, th, hasAnswer: !!(res.answer || res.answerBody) };
};

    switch (mt) {
      case 'petal': return lens(loc(r0 + h * 0.02, 0, a), loc(r1, 0, a), Math.min(hw * 0.95, h * 0.5));
      case 'petal2': return lens(loc(r0 + h * 0.02, 0, a), loc(r1, 0, a), Math.min(hw * 0.95, h * 0.5)) + lens(loc(r0 + h * 0.26, 0, a), loc(r1 - h * 0.2, 0, a), Math.min(hw * 0.48, h * 0.26));
      case 'leaf2': { const A0 = loc(r0 + h * 0.08, 0, a); return lens(A0, loc(r1 - h * 0.05, -hw * 0.55, a), Math.min(hw * 0.3, h * 0.2)) + lens(A0, loc(r1 - h * 0.05, hw * 0.55, a), Math.min(hw * 0.3, h * 0.2)); }
      case 'scallop': { const p0 = pol(r0, a - da / 2), p2 = pol(r0, a + da / 2), k = r0 * Math.cos(da / 2); return `<path d="M${P(p0)}Q${P(pol(2 * r1 - k, a))} ${P(p2)}"/><path d="M${P(p0)}Q${P(pol(2 * (r0 + h * 0.55) - k, a))} ${P(p2)}"/>`; }
      case 'tear': { const b = Math.min(h * 0.28, hw * 0.62), uc = r0 + h * 0.06 + b, tip = loc(r1 - h * 0.04, 0, a), t1 = loc(uc + b * 0.5, -b * 0.866, a), t2 = loc(uc + b * 0.5, b * 0.866, a); return `<path d="M${P(t1)}L${P(tip)}L${P(t2)}A${f(b)} ${f(b)} 0 1 1 ${P(t1)}Z"/>`; }

      case 'dots': { const cr = Math.min(h * 0.24, hw * 0.5), c = loc(rm, 0, a); return `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(cr)}"/>`; }

KP.thGuide = (x, w, base, xh) => {
  const top = base - xh, up = base - xh * 1.75, low = base + xh * 0.55;
  return `<line x1="${f(x)}" y1="${f(up)}" x2="${f(x + w)}" y2="${f(up)}" stroke="#c4cbe0" stroke-width="1" stroke-dasharray="2 4"/>` +
    `<line x1="${f(x)}" y1="${f(top)}" x2="${f(x + w)}" y2="${f(top)}" stroke="#7d8db5" stroke-width="1.2"/>` +
    `<line x1="${f(x)}" y1="${f(base)}" x2="${f(x + w)}" y2="${f(base)}" stroke="#3b4a72" stroke-width="1.6"/>` +
    `<line x1="${f(x)}" y1="${f(low)}" x2="${f(x + w)}" y2="${f(low)}" stroke="#c4cbe0" stroke-width="1" stroke-dasharray="2 4"/>`;
};
KP.thText = (s, x, base, xh, mode) => {
  const fs = xh / TH_XH;
  if (mode === 'solid') return txt(x, base, s, { size: fs, font: KP.F.th, fill: '#111' });
  if (mode === 'dash') return txt(x, base, s, { size: fs, font: KP.F.th, fill: 'none', stroke: '#888', sw: Math.max(1.1, fs * 0.012), dash: `${f(fs * 0.03)} ${f(fs * 0.025)}` });
  if (mode === 'dark') return txt(x, base, s, { size: fs, font: KP.F.th, fill: '#bdbdbd' });
  return txt(x, base, s, { size: fs, font: KP.F.th, fill: '#d6d6d6' });
};
KP.thWidth = (s, xh) => KP.measure(s, xh / TH_XH, KP.F.th);

    { k: 'rep', l: 'แถวต่อคำ', t: 'rng', min: 1, max: 4, d: 2 },
    { k: 'style', l: 'แบบเส้น', t: 'sel', o: [['trace', 'จุดไข่ปลา'], ['gray', 'เส้นจางสีเทา'], ['dash', 'เส้นประ']], d: 'trace' },
    { k: 'blank', l: 'แถวว่างท้ายหน้า', t: 'rng', min: 0, max: 4, d: 1 }

  title: (p, L) => L('ฝึกเขียนคำ', 'Word Tracing'),
  instr: (p, L) => L('ลากเส้นตามจุดให้ครบ แล้วเขียนเองในแถวว่าง', 'Trace each word, then write it on the empty line.'),
  render(p, ctx) {
    const { box } = ctx;
    const words = String(p.text || '').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 12);
    const rh = { s: 0.78, m: 1.05, l: 1.4 }[p.size] * U;
    const rows = []; words.forEach(w => { for (let i = 0; i < (+p.rep || 1); i++) rows.push({ w, k: i }); });
    for (let i = 0; i < (+p.blank || 0); i++) rows.push({ w: '', k: 9 });
    const maxRows = Math.floor(box.h / rh); const list = rows.slice(0, maxRows);
    const used = list.length * rh, y0 = box.y + Math.max(0, (box.h - used) / 2 - 6);
    let s = '';
    list.forEach((r, i) => {
      const ry = y0 + i * rh;
      if (KP.isThai(r.w)) {
        const xh = rh * 0.36, base = ry + rh * 0.66; s += KP.thGuide(box.x, box.w, base, xh);
        const ww = KP.thWidth(r.w, xh) + xh * 1.6; let x = box.x + 8, k = 0;
        do { s += KP.thText(r.w, x, base, xh, k === 0 && r.k === 0 ? 'dark' : (p.style === 'dash' ? 'dash' : 'gray')); x += ww; k++; } while (x + ww - xh * 1.6 < box.x + box.w - 8 && k < 8);
      } else {
        const capH = rh * 0.5, base = ry + rh * 0.66; const lower = /[gjpqy]/.test(r.w) || !r.w;
        s += KP.guide(box.x, box.w, base, capH, { desc: lower });
        if (!r.w) return;
        const gw = KP.glyphWidth(r.w, capH), step = gw + capH * 0.9; let x = box.x + 10, k = 0;
        do { s += KP.glyphText(r.w, x, base, capH, k === 0 && r.k === 0 ? 'dark' : p.style, { lw: ctx.lw }).svg; x += step; k++; } while (x + gw < box.x + box.w - 8 && k < 8);
      }
    });
    return { body: s };
  }
});

const LINE_KINDS = [['mixed', 'ผสมทุกแบบ'], ['horizontal', 'เส้นตรงแนวนอน'], ['diagonal', 'เส้นเฉียง'], ['zigzag', 'ซิกแซก'], ['wave', 'คลื่น'], ['arch', 'โค้งสะพาน'], ['loop', 'ห่วงวน'], ['castle', 'ปราสาท'], ['mountain', 'ภูเขา']];
function linePath(kind, x0, x1, y, A, rng) {
  const W = x1 - x0; let d = '';
  switch (kind) {
    case 'horizontal': return `M${f(x0)} ${f(y)}L${f(x1)} ${f(y)}`;
    case 'diagonal': { const n = Math.max(4, Math.round(W / (A * 1.6))); for (let i = 0; i < n; i++) { const x = x0 + i * W / n; d += `M${f(x)} ${f(y + A)}L${f(x + W / n * 0.7)} ${f(y - A)}`; } return d; }
    case 'zigzag': { const n = Math.max(4, Math.round(W / (A * 1.4))) * 2; d = `M${f(x0)} ${f(y + A)}`; for (let i = 1; i <= n; i++) d += `L${f(x0 + i * W / n)} ${f(y + (i % 2 ? -A : A))}`; return d; }
    case 'wave': { const n = Math.max(3, Math.round(W / (A * 3))); const st = W / n; d = `M${f(x0)} ${f(y)}`; for (let i = 0; i < n; i++) d += `Q${f(x0 + i * st + st / 4)} ${f(y - A * 1.6)} ${f(x0 + i * st + st / 2)} ${f(y)}Q${f(x0 + i * st + 3 * st / 4)} ${f(y + A * 1.6)} ${f(x0 + (i + 1) * st)} ${f(y)}`; return d; }
    case 'arch': { const n = Math.max(3, Math.round(W / (A * 2.4))); const r = W / n / 2; d = `M${f(x0)} ${f(y + A * 0.6)}`; for (let i = 0; i < n; i++) d += `A${f(r)} ${f(r * 1.25)} 0 0 1 ${f(x0 + (i + 1) * 2 * r)} ${f(y + A * 0.6)}`; return d; }
    case 'castle': { const n = Math.max(4, Math.round(W / (A * 1.6))); const st = W / n; d = `M${f(x0)} ${f(y + A)}`; for (let i = 0; i < n; i++) { const xx = x0 + i * st; d += i % 2 ? `L${f(xx)} ${f(y + A)}L${f(xx + st)} ${f(y + A)}` : `L${f(xx)} ${f(y - A)}L${f(xx + st)} ${f(y - A)}`; } return d + `L${f(x1)} ${f(y + A)}`; }
    case 'mountain': { const n = Math.max(3, Math.round(W / (A * 2.2))); const st = W / n; d = `M${f(x0)} ${f(y + A)}`; for (let i = 0; i < n; i++) { const hh = A * (0.9 + rng() * 1.1); d += `L${f(x0 + i * st + st / 2)} ${f(y + A - hh * 1.4)}L${f(x0 + (i + 1) * st)} ${f(y + A)}`; } return d; }
    case 'loop': { const n = Math.max(3, Math.round(W / (A * 1.9))); const a = (W - A * 1.2) / (n * 2 * Math.PI), b = Math.min(A * 0.95, a * 2.2); let first = true; for (let t = 0; t <= n * 2 * Math.PI + 0.001; t += 0.12) { const x = x0 + A * 0.6 + a * t - b * Math.sin(t), yy = y + A * 0.5 - b * (1 - Math.cos(t)) * 0.75; d += (first ? 'M' : 'L') + f(x) + ' ' + f(yy); first = false; } return d; }
  }
  return `M${f(x0)} ${f(y)}L${f(x1)} ${f(y)}`;
}
const PAIRS = [['bee', 'flower'], ['car', 'house'], ['rocket', 'moon'], ['dog', 'ball'], ['butterfly', 'flower'], ['penguin', 'fish'], ['mouse', 'cupcake'], ['chicken', 'egg'], ['owl', 'tree'], ['boat', 'sun'], ['turtle', 'leaf'], ['whale', 'star']];

  id: 'lines', cat: 'write', name: 'ลากเส้นพื้นฐาน', icon: '〰', desc: 'ฝึกกล้ามเนื้อมือก่อนเขียน: ตรง ซิกแซก คลื่น ห่วง', header: 'full',
  params: [
    { k: 'kind', l: 'แบบเส้น', t: 'sel', o: LINE_KINDS, d: 'mixed' },
    { k: 'rows', l: 'จำนวนแถว', t: 'rng', min: 3, max: 8, d: 5 },
    { k: 'icons', l: 'ภาพต้นทาง–ปลายทาง', t: 'chk', d: true }
  ],
  title: (p, L) => L('ลากเส้นตามรอยประ', 'Trace the Lines'),
  instr: (p, L) => L('เริ่มที่จุดสีเขียว ลากตามรอยประให้ถึงปลายทาง', 'Start at the green dot and follow the dotted path.'),

      if (ic) { const pr = pairs[i % pairs.length]; s += KP.drawArt(pr[0], box.x, y - ic / 2, ic, 2.4) + KP.drawArt(pr[1], box.x + box.w - ic, y - ic / 2, ic, 2.4); }

    }
    return { body: s };

});

function boxDims(n) { return n === 4 ? [2, 2] : n === 6 ? [2, 3] : [3, 3]; }
function sdkCan(g, n, r, c, v) { const [br, bc] = boxDims(n); for (let i = 0; i < n; i++) if (g[r][i] === v || g[i][c] === v) return false; const r0 = Math.floor(r / br) * br, c0 = Math.floor(c / bc) * bc; for (let i = 0; i < br; i++) for (let j = 0; j < bc; j++) if (g[r0 + i][c0 + j] === v) return false; return true; }
function sdkFill(g, n, rng) { for (let k = 0; k < n * n; k++) { const r = Math.floor(k / n), c = k % n; if (g[r][c]) continue; for (const v of rng.shuffle(Array.from({ length: n }, (_, i) => i + 1))) { if (sdkCan(g, n, r, c, v)) { g[r][c] = v; if (sdkFill(g, n, rng)) return true; g[r][c] = 0; } } return false; } return true; }
function sdkCount(g, n, lim = 2) { let cnt = 0; const solve = () => { let br = -1, bc = -1, best = 99; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!g[r][c]) { let k = 0; for (let v = 1; v <= n; v++) if (sdkCan(g, n, r, c, v)) k++; if (k < best) { best = k; br = r; bc = c; } } if (br < 0) { cnt++; return; } for (let v = 1; v <= n && cnt < lim; v++) if (sdkCan(g, n, br, bc, v)) { g[br][bc] = v; solve(); g[br][bc] = 0; } }; solve(); return cnt; }
KP.sudoku = (n, level, rng) => {
  const sol = Array.from({ length: n }, () => Array(n).fill(0)); sdkFill(sol, n, rng);
  const puz = sol.map(r => r.slice());

  let filled = n * n;
  for (const k of rng.shuffle(Array.from({ length: n * n }, (_, i) => i))) {
    if (filled <= keep) break; const r = Math.floor(k / n), c = k % n, v = puz[r][c]; puz[r][c] = 0;
    if (sdkCount(puz.map(x => x.slice()), n) !== 1) puz[r][c] = v; else filled--;

/* =========================================================
   KidPrint Studio — export: print-to-PDF, PDF download, PNG, ZIP, project
   ========================================================= */
(function () {
'use strict';
const KP = window.KP, U = KP.U;
const JSPDF = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';

/* ---------- fonts embedded into SVG (needed when SVG is drawn to canvas) ---------- */
KP.fontCSS = () => {
  if (KP._fontP) return KP._fontP;
  KP._fontP = (async () => {
    try {
      const css = await (await fetch(KP.FONT_PAGE)).text();
      const re = /\/\*\s*([\w-]+)\s*\*\/\s*@font-face\s*{([^}]*)}/g; const blocks = []; let m;
      while ((m = re.exec(css))) if (m[1] === 'thai' || m[1] === 'latin') blocks.push(m[2]);
      const toData = async url => { const b = await (await fetch(url)).blob(); return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); };
      const out = await Promise.all(blocks.map(async b => { const u = (b.match(/url\(([^)]+)\)/) || [])[1]; if (!u) return ''; const data = await toData(u.replace(/["']/g, '')); return '@font-face{' + b.replace(/url\([^)]+\)/, `url(${data})`) + '}'; }));
      return out.join('\n');
    } catch (e) { console.warn('font embed failed', e); return ''; }
  })();
  return KP._fontP;
};
KP.svgToCanvas = async (svg, pxW) => {
  const css = await KP.fontCSS();
  const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/); const W = +vb[1], H = +vb[2];
  const pxH = Math.round(pxW * H / W);
  let s = svg.replace(/ width="[^"]+in" height="[^"]+in"/, ` width="${pxW}" height="${pxH}"`);
  if (css) s = s.replace(/^<svg([^>]*)>/, `<svg$1><defs><style>${css}</style></defs>`);
  const url = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml' }));
  try {
    const im = await KP.loadImage(url);
    const c = document.createElement('canvas'); c.width = pxW; c.height = pxH;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, pxW, pxH); g.drawImage(im, 0, 0, pxW, pxH);
    return c;
  } finally { URL.revokeObjectURL(url); }
};
KP.canvasBlob = (c, type = 'image/png', q) => new Promise(r => c.toBlob(r, type, q));

/* ---------- render whole book ---------- */
KP.renderBook = book => { const items = KP.assemble(book); return items.map((it, i) => KP.renderItem(it, book, i)); };

/* ---------- print (vector, best quality) ---------- */
KP.exportPrint = async book => {
  const pages = KP.renderBook(book);
  if (!pages.length) return KP.toast('ยังไม่มีหน้าในสมุด', 'bad');
  const W = pages[0].W / U, H = pages[0].H / U;
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${KP.esc(book.name)}</title>
<link rel="stylesheet" href="${KP.FONT_PAGE}">
<style>@page{size:${W}in ${H}in;margin:0}html,body{margin:0;padding:0;background:#fff}.pg{width:${W}in;height:${H}in;overflow:hidden;page-break-after:always;break-after:page}.pg:last-child{page-break-after:auto;break-after:auto}.pg svg{width:${W}in;height:${H}in;display:block}</style></head>
<body>${pages.map(p => `<div class="pg">${p.svg}</div>`).join('')}</body></html>`;
  const ifr = document.createElement('iframe');
  ifr.setAttribute('aria-hidden', 'true'); ifr.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
  document.body.appendChild(ifr);
  const doc = ifr.contentDocument; doc.open(); doc.write(html); doc.close();
  KP.toast('กำลังเตรียมไฟล์… ในหน้าต่างพิมพ์ให้เลือก "บันทึกเป็น PDF" · ขอบกระดาษ: ไม่มี', '', 6000);
  await new Promise(r => setTimeout(r, 400));
  try { await ifr.contentWindow.document.fonts.ready; } catch (e) { }
  await new Promise(r => setTimeout(r, 300));
  ifr.contentWindow.focus(); ifr.contentWindow.print();
  setTimeout(() => ifr.remove(), 120000);
};

/* ---------- direct PDF download (raster, consistent everywhere) ---------- */
KP.exportPDF = async (book, dpi = 300) => {
  const pages = KP.renderBook(book); if (!pages.length) return KP.toast('ยังไม่มีหน้าในสมุด', 'bad');
  const pr = KP.progress('กำลังสร้าง PDF');
  try {
    await KP.loadScript(JSPDF);
    const { jsPDF } = window.jspdf;
    const W = pages[0].W / U, H = pages[0].H / U;
    const pdf = new jsPDF({ unit: 'in', format: [W, H], orientation: W > H ? 'l' : 'p', compress: true });
    for (let i = 0; i < pages.length; i++) {
      pr.set(i, pages.length, `กำลังวาดหน้า ${i + 1} จาก ${pages.length}`);
      const c = await KP.svgToCanvas(pages[i].svg, Math.round(W * dpi));
      if (i) pdf.addPage([W, H], W > H ? 'l' : 'p');
      pdf.addImage(c.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, W, H, undefined, 'FAST');
      await KP.sleep(5);
    }
    pr.set(pages.length, pages.length, 'กำลังบันทึกไฟล์…');
    pdf.save(KP.slug(book.name) + '.pdf');
    KP.toast('ดาวน์โหลด PDF แล้ว', 'ok');
  } catch (e) { console.error(e); KP.toast('สร้าง PDF ไม่สำเร็จ: ' + e.message, 'bad', 6000); }
  finally { pr.close(); }
};

/* ---------- PNG ---------- */
KP.exportPNG = async (svg, name, dpi = 300) => {
  const W = +svg.match(/viewBox="0 0 ([\d.]+)/)[1] / U;
  const c = await KP.svgToCanvas(svg, Math.round(W * dpi));
  KP.download(await KP.canvasBlob(c), name + '.png');
};
KP.exportZip = async (book, dpi = 300) => {
  const pages = KP.renderBook(book); if (!pages.length) return KP.toast('ยังไม่มีหน้าในสมุด', 'bad');
  const pr = KP.progress('กำลังสร้างไฟล์ PNG ทั้งเล่ม');
  try {
    await KP.loadScript(JSZIP);
    const zip = new window.JSZip(); const W = pages[0].W / U;
    for (let i = 0; i < pages.length; i++) {
      pr.set(i, pages.length, `หน้า ${i + 1} จาก ${pages.length}`);
      const c = await KP.svgToCanvas(pages[i].svg, Math.round(W * dpi));
      zip.file(`${String(i + 1).padStart(3, '0')}.png`, await KP.canvasBlob(c));
    }
    pr.set(1, 1, 'กำลังบีบอัด…');
    KP.download(await zip.generateAsync({ type: 'blob' }), KP.slug(book.name) + '-png.zip');
    KP.toast('ดาวน์โหลด .zip แล้ว', 'ok');
  } catch (e) { console.error(e); KP.toast('ไม่สำเร็จ: ' + e.message, 'bad', 6000); }
  finally { pr.close(); }
};

/* ---------- project files ---------- */
KP.saveProject = book => KP.download(new Blob([JSON.stringify({ app: 'kidprint-studio', v: 1, book }, null, 1)], { type: 'application/json' }), KP.slug(book.name) + '.kidprint.json');
KP.openProject = () => new Promise(res => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => { const fr = new FileReader(); fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d.book || !Array.isArray(d.book.pages)) throw new Error('ไม่ใช่ไฟล์โปรเจกต์ของแอปนี้'); d.book.settings = Object.assign(KP.defaultSettings(), d.book.settings || {}); res(d.book); } catch (e) { KP.toast(e.message, 'bad'); res(null); } }; fr.readAsText(i.files[0]); };
  i.click();
});
})();

KP.pageInfo = pg => {
  const p = pg.params || {}; const g = KP.GENS[pg.gen] || {};
  const bits = [];
  if (p.level) bits.push({ easy: 'ง่าย', medium: 'กลาง', hard: 'ยาก', expert: 'ยากมาก', hour: 'ชั่วโมง', half: 'ครึ่ง', quarter: '15 นาที', five: '5 นาที', minute: 'นาที' }[p.level] || p.level);
  if (p.letter) bits.push(p.letter);
  if (p.art && p.art !== 'random' && KP.ART_BY[p.art]) bits.push(KP.ART_BY[p.art].th);
  if (p.shape && p.shape !== 'random' && p.shape !== 'all') bits.push(p.shape);
  if (p.theme) bits.push(p.theme);
  if (p.op) bits.push(p.op);
  if (p.title && g.cat === 'page') bits.push(p.title);
  return bits.slice(0, 3).join(' · ') || (KP.CATS.find(c => c.id === g.cat) || {}).name || '';
};

/* presets modal */
KP.openPresets = () => {

  KP.PRESETS.forEach(pr => {

  }
};
})();

  { id: 'kdp_price', combo: [['kdp', 'ราคา'], ['amazon', 'ราคา']], k: ['ราคา kdp', 'royalty', 'รอยัลตี้', 'รอยัลตี', 'ค่าลิขสิทธิ์', 'ตั้งราคา kdp', '9.99', 'ค่าพิมพ์', 'printing cost'], q: 'KDP ตั้งราคาเท่าไหร่ดี', a: 'กฎสำคัญของ Amazon.com (ตั้งแต่ 10 มิ.ย. 2025):\n- ราคา **≤ $9.98 ได้ royalty 50%** · ราคา **≥ $9.99 ได้ 60%**\n- ค่าพิมพ์ขาวดำ 24–110 หน้า: $2.30 (เล่มใหญ่ เช่น 8.5×11″: **$2.84**)\n- เกิน 110 หน้า: $1.00 + $0.012/หน้า (เล่มใหญ่ $0.017/หน้า)\n\nตัวอย่าง สมุด 8.5×11″ 60 หน้า ราคา $9.99 → 0.6×9.99 − 2.84 ≈ **$3.15/เล่ม** ถ้าตั้ง $8.99 จะเหลือเพียง ≈ $1.66\n\nพิมพ์เช่น "kdp 80 หน้า $9.99" ให้ผมคำนวณได้', src: [['KDP Paperback Royalty', 'https://kdp.amazon.com/help/topic/G201834330'], ['KDP Printing Cost', 'https://kdp.amazon.com/help/topic/G201834340']], go: [['เครื่องคิดเงิน KDP', 'money']], next: ['kdp_cover', 'kdp_pay'] },
  { id: 'kdp_pay', combo: [['kdp', 'payoneer'], ['amazon', 'payoneer'], ['kdp', 'รับเงิน'], ['kdp', 'จ่ายเงิน']], k: ['kdp จ่าย', 'รับเงิน kdp', 'kdp payoneer', 'ธนาคาร kdp', 'amazon จ่าย', 'โอนเงิน amazon', 'receiving account'], q: 'KDP จ่ายเงินยังไง', a: '- ใช้ **USD Receiving Account ของ Payoneer** (เมนู Receive) กรอกเป็น Direct Deposit ใน KDP — Payoneer อยู่ในรายชื่อผู้ให้บริการชำระเงิน (PSP) ที่ Amazon อนุญาต\n- จ่ายทุกเดือน ประมาณ **60 วันหลังสิ้นเดือน** ที่ขายได้\n- Direct deposit ปกติไม่มียอดขั้นต่ำ\n- แล้วถอนจาก Payoneer เข้าธนาคารไทย', src: [['KDP Payment Service Provider Program', 'https://kdp.amazon.com/help/topic/GD9NN4LS8ZDU8XZ7']], next: ['payoneer_fees', 'tax_thai'] },
  { id: 'kdp_cover', combo: [['kdp', 'ปก']], k: ['ปก', 'cover', 'สันปก', 'spine', 'bleed', 'ตัดตก', 'cover creator'], q: 'ทำปก KDP / bleed', a: '- ใช้ **Cover Creator** ของ KDP ทำปกได้ง่ายที่สุด\n- ถ้าทำเอง: ความกว้างปกกางเต็ม = 0.125 + หลัง + **สัน** + หน้า + 0.125 นิ้ว · สูง = ความสูงเล่ม + 0.25 นิ้ว\n- **สัน** = จำนวนหน้า × 0.002252″ (กระดาษขาว) หรือ × 0.0025″ (ครีม)\n- **ห้ามใส่ตัวหนังสือบนสัน** ถ้าน้อยกว่า 79 หน้า\n- เนื้อในที่ไม่มีภาพชิดขอบ → เลือก **No bleed**\n\nเครื่องคิดในหน้า "รายได้" คำนวณขนาดปกให้', src: [['KDP Create a Paperback Cover', 'https://kdp.amazon.com/help/topic/G201953020']], go: [['เครื่องคิด KDP', 'money']], next: ['kdp_files', 'kdp_price'] },
  { id: 'kdp_files', k: ['pdf', 'ไฟล์', 'ขนาดกระดาษ', 'trim', '8.5', 'a4', 'letter', 'ส่งออก', 'export', 'dpi'], q: 'ส่งออกไฟล์ขนาดไหน', a: '- **Etsy / ขายไฟล์**: US Letter 8.5×11″ + ทำ A4 อีกไฟล์ (เปลี่ยนใน "ตั้งค่าเล่ม")\n- **KDP**: เลือกขนาดเล่มที่จะตั้ง (นิยม 8.5×11″) อย่างน้อย 24 หน้า\n- ปุ่ม **"บันทึกเป็น PDF (คมชัดสุด)"** → ในหน้าต่างพิมพ์เลือก บันทึกเป็น PDF · ขอบกระดาษ: ไม่มี · สเกล 100%\n- ปุ่ม **PDF 300dpi** ดาวน์โหลดตรง เหมาะกับมือถือ\n- **PNG .zip** สำหรับทำภาพตัวอย่างหรือขายเป็นภาพ', go: [['ตั้งค่าเล่ม', 'settings']], next: ['print_settings', 'single_sided'] },
  { id: 'payoneer_fees', combo: [['payoneer', 'ค่าธรรมเนียม'], ['payoneer', 'ถอน'], ['payoneer', 'fee']], k: ['payoneer ค่า', 'ค่ารายปี', '29.95', 'ถอนเงิน', 'ถอน', 'payoneer fee', 'ค่าแปลงสกุล'], q: 'ค่าธรรมเนียม Payoneer', a: '- **ค่าบัญชีรายปี 29.95 USD** เก็บเฉพาะเมื่อ 12 เดือนติดกันรับเงินไม่ถึง 6,000 USD\n- **ถอน USD → บาท** มีค่าแปลงสกุลเงิน เงินจาก Etsy ระบุสูงสุด 2% (ช่องทางอื่นราว 1.2–4%)\n- ดูอัตราจริงที่เมนู **Fees** หลังล็อกอิน\n- เคล็ดลับ: ถอนเป็นรอบใหญ่ เก็บ statement ทุกเดือน', src: [['Payoneer Pricing (TH)', 'https://www.payoneer.com/th/about/pricing/']], next: ['payoneer_setup', 'tax_thai'] },
  { id: 'payoneer_setup', k: ['สมัคร payoneer', 'ยืนยันตัวตน', 'payoneer', 'เพเยอเนียร์', 'บัญชี usd', 'verify'], q: 'ตั้งค่า Payoneer', a: '1. ยืนยันตัวตนให้ผ่าน (ชื่อตรงบัตรประชาชน)\n2. เพิ่มบัญชีธนาคารไทยชื่อเดียวกัน สำหรับถอนเงิน\n3. Etsy: เชื่อมตอนเปิดร้าน (Etsy Payments via Payoneer)\n4. KDP: ใช้เลขบัญชี **USD Receiving Account** จากเมนู Receive\n5. ห้ามใช้บัญชีคนอื่น ชื่อทุกที่ต้องตรงกัน', go: [['คู่มือ Payoneer', 'guide:payoneer']], next: ['payoneer_fees', 'etsy_payoneer'] },
  { id: 'tax_thai', k: ['ภาษี', 'สรรพากร', 'ยื่นภาษี', 'ภงด', 'ภ.ง.ด', 'เสียภาษี', 'รายได้ต่างประเทศ', 'tax'], q: 'ต้องเสียภาษีไหม', a: '**ควรยื่นครับ** (ข้อมูลทั่วไป ไม่ใช่คำปรึกษาภาษี)\n- ผู้มีถิ่นที่อยู่ในไทย (อยู่ไทย ≥180 วัน/ปี) ต้องยื่นภาษีเงินได้บุคคลธรรมดา ภายใน **31 มี.ค. ของปีถัดไป**\n- **เงินได้จากต่างประเทศ** ที่ได้รับตั้งแต่ปี 2024 ต้องเสียภาษีในปีที่นำเข้าไทย (ข้อเสนอยกเว้นยังไม่มีผล ณ ส.ค. 2026) → เงินที่ถอนจาก Payoneer เข้าบัญชีไทยควรนำไปยื่น\n- ภาษีที่ถูกหักในสหรัฐฯ (เช่น KDP) เก็บหลักฐานไว้ขอเครดิตภาษีต่างประเทศได้\n- เก็บ statement ทุกช่องทาง ใช้หน้า "รายได้" บันทึกยอด\n- รายได้มากขึ้นควรปรึกษานักบัญชี หรือโทร 1161', src: [['กรมสรรพากร', 'https://www.rd.go.th'], ['PwC Thailand Individual Tax', 'https://taxsummaries.pwc.com/thailand/individual']], go: [['บันทึกยอดขาย', 'money']], next: ['kdp_tax', 'income'] },
  { id: 'copyright', k: ['ลิขสิทธิ์', 'disney', 'ดิสนีย์', 'ตัวการ์ตูน', 'pokemon', 'โปเกมอน', 'bluey', 'เครื่องหมายการค้า', 'trademark', 'ฟอนต์', 'font', 'sanrio', 'paw patrol'], q: 'เรื่องลิขสิทธิ์', a: '- **ห้าม** ใช้ตัวละคร/โลโก้ที่มีเจ้าของ (Disney, Pokémon, Bluey, Paw Patrol, Sanrio ฯลฯ) แม้วาดใหม่ ร้านโดนปิดได้\n- ภาพในแอปนี้ **ออกแบบขึ้นใหม่ทั้งหมด** ใช้ขายได้\n- ฟอนต์ในใบงานเป็น Google Fonts (SIL Open Font License) **ใช้เชิงพาณิชย์ได้**\n- รูปที่อัปโหลดเองต้องเป็นของคุณ หรือมีสิทธิ์เชิงพาณิชย์\n- ใส่ **หน้าลิขสิทธิ์/สิทธิ์การใช้** (หมวดหน้าพิเศษ) ในทุกไฟล์', go: [['เพิ่มหน้าลิขสิทธิ์', 'studio:copy']], next: ['ai_policy'] },
  { id: 'price', k: ['ตั้งราคา', 'ราคาเท่าไหร่', 'ขายกี่บาท', 'ราคา', 'price', 'กี่ดอล'], q: 'ตั้งราคาเท่าไหร่ดี', a: 'ช่วงราคาที่พบบ่อย (ดูคู่แข่งจริงก่อนตั้ง):\n- ไฟล์ 10–20 หน้า: **$1.99–$3.99** / 29–59 บาท\n- เล่ม 30–60 หน้า: **$3.99–$7.99** / 59–149 บาท\n- บันเดิล 100+ หน้า: **$8.99–$19.99** / 149–299 บาท\n- ใส่ชื่อเด็ก (personalized): **$4.99–$9.99**\n- KDP 8.5×11″: **$9.99** (ได้ royalty 60%)\n\nร้านใหม่เริ่มกลาง ๆ แล้วทำโปรโมชันช่วงแรกเพื่อเก็บรีวิว', go: [['คำนวณกำไร', 'listing:price']], next: ['kdp_price', 'etsy_fees', 'bundle'] },
  { id: 'niche', k: ['นิช', 'niche', 'ทำอะไรขายดี', 'ขายดี', 'ไอเดีย', 'ธีม', 'อะไรขายได้', 'trend', 'เทรนด์'], q: 'ทำอะไรขายดี', a: 'นิชที่มีคนค้นตลอดปี:\n- **ไดโนเสาร์, สัตว์ทะเล, อวกาศ, ยานพาหนะ** สำหรับเด็ก 3–8 ปี\n- **ABC / 123 tracing** สำหรับอนุบาล (ครูและโฮมสคูลซื้อซ้ำ)\n- **Mazes, word search, activity book** สำหรับเดินทาง\n- **Mandala** สำหรับผู้ใหญ่ (KDP)\n- **ก-ฮ, เลขไทย** สำหรับตลาดไทยและครอบครัวไทยในต่างประเทศ\n\nบวกธีม **เทศกาล** ลงล่วงหน้า 30–45 วัน หน้า "รายได้" มีปฏิทินและตัวสุ่มไอเดีย', go: [['ปฏิทินเทศกาล', 'money']], next: ['first_sale', 'bundle'] },
  { id: 'first_sale', k: ['ขายไม่ได้', 'ยอดขาย', 'ชิ้นแรก', 'ไม่มีคนซื้อ', 'โปรโมท', 'การตลาด', 'pinterest', 'ยิงแอด', 'โฆษณา', 'ads'], q: 'ทำยังไงให้ขายได้ชิ้นแรก', a: '- **จำนวนสำคัญ**: ร้านที่มี 30–100+ ชิ้นมีโอกาสถูกค้นเจอมากกว่ามาก ลงสม่ำเสมอ\n- **ภาพหลักต้องชัด** อ่านชื่อได้แม้ภาพเล็ก\n- **ชื่อ+แท็ก** ใช้คำที่คนค้นจริง เจาะกลุ่มอายุ\n- **Pinterest**: ปักหมุดภาพสินค้าวันละ 3–5 รูป ลิงก์กลับร้าน\n- ทำ **บันเดิล** และ **สินค้าเทศกาล**\n- ขอรีวิวด้วยหน้าขอบคุณในไฟล์\n- อดทน: หลายร้านใช้เวลา 1–3 เดือนกว่าจะเห็นยอดสม่ำเสมอ', next: ['etsy_seo', 'niche', 'income'] },
  { id: 'thai_market', k: ['shopee', 'lazada', 'ช้อปปี้', 'ลาซาด้า', 'line', 'ไลน์', 'facebook', 'เฟซบุ๊ก', 'เฟส', 'tiktok', 'ติ๊กต็อก', 'ขายในไทย', 'พร้อมเพย์', 'ตลาดไทย'], q: 'ขายในไทยยังไง', a: '- **LINE OA / Facebook**: รับพร้อมเพย์ ส่งไฟล์ทางลิงก์ เหมาะกับไฟล์ PDF\n- **กลุ่มเป้าหมาย**: กลุ่มคุณแม่ ครูอนุบาล–ป.2, TikTok คลิปลูกทำใบงานจริง\n- **Shopee/Lazada**: นิยมขายเป็นเล่มพิมพ์ ถ้าจะขายไฟล์ดิจิทัลให้ตรวจกฎหมวดสินค้าก่อน\n- สินค้าเด่น: **ก-ฮ, เลขไทย, สมุดกิจกรรมไทย**\n\nหน้า "ช่วยลงขาย" › แท็บ ตลาดไทย มีชื่อสินค้าและโพสต์ให้', go: [['สมุดกิจกรรมไทย', 'presets'], ['ประกาศภาษาไทย', 'listing:th']], next: ['price', 'tracing_thai'] },
  { id: 'gumroad', k: ['gumroad', 'กัมโรด'], q: 'Gumroad', a: '- ค่าธรรมเนียมขายผ่านลิงก์ตัวเอง **10% + $0.50** (ขายผ่าน Discover 30%)\n- Gumroad เป็นผู้ขายตามกฎหมาย จัดการภาษีการขายให้\n- จ่ายเงินเข้า **ธนาคาร (สกุลท้องถิ่น) หรือ PayPal** เท่านั้น **ไม่รองรับ Payoneer**', src: [['Gumroad: Getting paid', 'https://gumroad.com/help/article/13-getting-paid']], next: ['payhip', 'tpt'] },
  { id: 'payhip', k: ['payhip', 'เพย์ฮิป'], q: 'Payhip', a: '- Free: ไม่มีรายเดือน หัก **5%** · Plus $29/เดือน หัก 2% · Pro $99/เดือน ไม่หัก\n- จ่ายค่า PayPal/Stripe ตามปกติเพิ่ม\n- เงินเข้า PayPal หรือ Stripe ทันที (Stripe ในไทยจ่ายเป็นบาท)\n- เหมาะเมื่อคุณมีผู้ติดตามของตัวเอง (Payhip ไม่ได้หาลูกค้าให้เหมือน Etsy)', src: [['Payhip Pricing', 'https://payhip.com/pricing']], next: ['gumroad', 'tpt'] },
  { id: 'tpt', k: ['tpt', 'teachers pay teachers', 'ขายให้ครู', 'ครูอเมริกา'], q: 'Teachers Pay Teachers', a: 'อัปเดต **1 ต.ค. 2026**: ปิดรับสมาชิก Premium ใหม่ เหลือ 2 แบบ\n- **Basic**: ค่าสมัคร $29 ครั้งเดียว ได้ **55%** หัก 30¢ ต่อชิ้น ไม่ผูกขาด\n- **Exclusive**: ส่วนแบ่งสูงกว่า แต่ต้องขายสื่อการสอนดิจิทัลบน TPT ที่เดียว\n- รับเงินผ่าน Hyperwallet (ตัวเลือกขึ้นกับประเทศ)\n- เหมาะกับใบงานคณิต/ภาษาอังกฤษที่ตรงหลักสูตรอเมริกา', next: ['gumroad', 'price'] },
  { id: 'income', k: ['รายได้', 'เดือนละ', 'อาชีพ', 'รายได้หลัก', 'ได้เงินเท่าไหร่', 'กี่บาท', 'รวย', 'passive'], q: 'จะมีรายได้เท่าไหร่', a: 'ตามจริงคือ **ขึ้นกับจำนวนสินค้าและเวลา** ร้านใหม่ส่วนใหญ่ขายช้าในเดือนแรก ๆ\n- ตัวอย่างเป้า 15,000 บาท/เดือน (~$440): ต้องขายราว **110 ชิ้น/เดือน** ถ้าสุทธิชิ้นละ ~$3.7 หรือผสม KDP เล่มละ ~$3\n- ถ้าแต่ละชิ้นขายได้ ~1 ครั้ง/เดือน ต้องมีสินค้า **100+ ชิ้น**\n- แอปนี้ช่วยลดเวลาทำสินค้าเหลือไม่กี่นาทีต่อชิ้น เวลาส่วนใหญ่จะไปอยู่ที่ภาพสินค้าและการลงขาย\n\nลองใส่ตัวเลขของคุณในหน้า "รายได้"', go: [['วางแผนรายได้', 'money']], next: ['first_sale', 'niche'] },
  { id: 'app_howto', k: ['ใช้แอป', 'วิธีใช้', 'สร้างหน้า', 'เพิ่มหน้า', 'สตูดิโอ', 'studio', 'แก้หน้า', 'ลบหน้า', 'เรียงหน้า'], q: 'ใช้แอปนี้ยังไง', a: '1. **สตูดิโอ** เลือกหมวด (ระบายสี/ฝึกเขียน/คณิต/ปริศนา/หน้าพิเศษ) → เลือกชนิด → ปรับค่า\n2. กด **🎲 สุ่มใหม่** จนชอบ แล้ว **เพิ่มลงสมุด** (หรือ "เพิ่มทีละ N หน้า" / "ครบชุด")\n3. คลิกหน้าในสมุดเพื่อแก้ · ลากเพื่อเรียง · ปุ่มลัด R = สุ่ม, A = เพิ่ม\n4. **ตั้งค่าเล่ม**: ขนาด ภาษา กรอบ พิมพ์ด้านเดียว เฉลย\n5. **บันทึกเป็น PDF** แล้วไป **ภาพสินค้า** และ **ช่วยลงขาย**', go: [['เปิดสตูดิโอ', 'studio']], next: ['presets', 'kdp_files'] },
  { id: 'print_settings', k: ['พิมพ์ไม่ได้', 'ขอบขาว', 'margin', 'ขนาดเพี้ยน', 'save as pdf', 'บันทึกเป็น pdf', 'หน้าต่างพิมพ์', 'safari', 'มือถือ'], q: 'ตั้งค่าหน้าต่างพิมพ์', a: 'ใน Chrome/Edge:\n- ปลายทาง: **บันทึกเป็น PDF**\n- ขอบกระดาษ: **ไม่มี (None)**\n- สเกล: **ค่าเริ่มต้น / 100%**\n- ขนาดกระดาษจะตั้งให้อัตโนมัติตามเล่ม\n\nถ้าใช้มือถือหรือ Safari แล้วขนาดไม่ตรง ให้ใช้ปุ่ม **PDF 300dpi** แทน', next: ['kdp_files'] },
  { id: 'github', k: ['github', 'กิทฮับ', 'ขึ้นเว็บ', 'deploy', 'pages', 'โฮสต์', 'host', 'เว็บไซต์'], q: 'นำแอปขึ้น GitHub Pages', a: '1. สร้าง repository ใหม่ (Public)\n2. อัปโหลด **index.html** ไปที่ root\n3. Settings › **Pages** › Deploy from a branch › **main** / **(root)** › Save\n4. รอ 1–2 นาที ได้ลิงก์ `https://ชื่อผู้ใช้.github.io/ชื่อrepo/`\n\n⚠️ ห้ามใส่ API key ลงในไฟล์ ให้ใส่ผ่านหน้าตั้งค่าในแอป', go: [['คู่มือแอป', 'guide:app']], next: ['ai_key'] },
  { id: 'ai_key', k: ['api', 'key', 'คีย์', 'ตั้งค่า ai', 'โหมด ai', 'ฉลาดขึ้น', 'claude', 'openrouter'], q: 'เปิดโหมด AI ของผู้ช่วย', a: 'ผู้ช่วยตอบจากฐานความรู้ในตัวได้เลยโดยไม่ต้องตั้งค่า ถ้าอยากให้ตอบยืดหยุ่นขึ้น:\n1. กดไอคอน **เฟือง** ที่แถบซ้าย (หรือปุ่มในหน้าต่างแชท)\n2. เลือกผู้ให้บริการ (Claude, Gemini หรือ OpenRouter) แล้ววาง API key ของคุณ\n3. คีย์เก็บในเบราว์เซอร์นี้เท่านั้น ค่าใช้จ่ายตามการใช้งานของผู้ให้บริการ\n\nอย่าใส่คีย์ในโค้ดที่อัปขึ้น GitHub', go: [['ตั้งค่า AI', 'ai']], next: ['github'] },
  { id: 'presets', k: ['สูตร', 'สำเร็จรูป', 'template', 'เทมเพลต', 'ทั้งเล่ม', 'ทำเร็ว'], q: 'สูตรสมุดสำเร็จรูป', a: 'มี 10 สูตร สร้างทั้งเล่มในคลิกเดียว เช่น สมุดระบายสีสัตว์, คัด ก-ฮ, ABC Tracing, Mazes 4-8, Kindergarten Math, Mandala, Activity Book, Color by Math, ABC Coloring, สมุดกิจกรรมไทย\n\nทุกเล่มสุ่มใหม่ไม่ซ้ำ **ควรปรับปก ชื่อร้าน และเลือกหน้าให้เป็นเอกลักษณ์** ก่อนขาย (Etsy ไม่อนุญาตสินค้าแบบอัตโนมัติจำนวนมากที่ไม่มีการคัดเลือก)', go: [['เปิดสูตรสำเร็จรูป', 'presets']], next: ['app_howto'] },
  { id: 'photo_line', k: ['แปลงรูป', 'อัปโหลดรูป', 'รูปถ่าย', 'ลายเส้น', 'line art', 'รูปลูก'], q: 'แปลงรูปเป็นหน้าระบายสี', a: 'สตูดิโอ › ระบายสี › **แปลงรูปเป็นลายเส้น**\n- **ภาพลายเส้นอยู่แล้ว** (เช่นภาพ AI แบบ coloring page): เลือกโหมดแรก ระบบจะทำเส้นให้คมขาวดำ\n- **ภาพถ่าย**: เลือกโหมดภาพถ่าย แล้วปรับ "รายละเอียดเส้น"\n- มีตัวช่วยเขียน prompt สำหรับเครื่องมือสร้างภาพ AI\n- ใช้รูปที่คุณมีสิทธิ์เท่านั้น และแจ้ง AI ถ้าใช้ภาพ AI', go: [['ลองแปลงรูป', 'studio:photo']], next: ['ai_policy'] },
  { id: 'tracing_thai', k: ['ก-ฮ', 'ก ไก่', 'คัดไทย', 'พยัญชนะ', 'เลขไทย', 'ภาษาไทย'], q: 'ใบงานภาษาไทย', a: '- สตูดิโอ › ฝึกเขียน › **คัดตัวอักษร** เลือก "พยัญชนะไทย ก-ฮ" หรือ "เลขไทย" แล้วกด **ครบทั้งชุด** ได้ 44 หน้าทันที\n- ระบายสี › **ตัวอักษรระบายสี** ก-ฮ พร้อมภาพประกอบ\n- ปริศนา › **ค้นหาคำศัพท์** ภาษาไทย / **ต่อจุด** ตามลำดับ ก ข ฃ\n- ตั้งภาษาในเล่มเป็นไทยใน "ตั้งค่าเล่ม"', go: [['สูตร ก-ฮ', 'presets']], next: ['thai_market'] },

/* ---------- markdown-lite ---------- */
function md(s) {
  const esc = KP.esc(s);
  const inline = x => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null;
  for (const line of esc.split('\n')) {
    const ul = line.match(/^\s*[-•]\s+(.*)/), ol = line.match(/^\s*\d+\.\s+(.*)/);
    if (ul || ol) { const tag = ul ? 'ul' : 'ol'; if (!list || list.tag !== tag) { if (list) out.push(`</${list.tag}>`); out.push(`<${tag}>`); list = { tag }; } out.push(`<li>${inline((ul || ol)[1])}</li>`); continue; }
    if (list) { out.push(`</${list.tag}>`); list = null; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`</${list.tag}>`);
  return out.join('');
}

/* ---------- UI ---------- */
let log, input, panel, history = [], updHead;
const SUGGEST = ['เริ่มต้นยังไงดี', 'ขาย Etsy จากไทยต้องใช้ Payoneer ไหม', 'KDP ตั้งราคาเท่าไหร่ดี', 'ต้องเสียภาษีไหม', 'ใช้รูปจาก AI ขายได้ไหม', 'ทำอะไรขายดี'];
function doAction(a) {
  if (a === 'presets') return KP.openPresets();
  if (a === 'settings') { KP.go('studio'); return setTimeout(() => KP.openBookSettings && KP.openBookSettings(), 50); }
  if (a === 'ai') return KP.openAISettings();
  const [v, sub] = a.split(':');
  if (v === 'studio' && sub) { const g = KP.GENS[sub]; if (g) { KP.studio.gen = sub; KP.studio.cat = g.cat; KP.studioRefresh && KP.studioRefresh(); } return KP.go('studio'); }
  if (v === 'guide') { KP.store.set('guideCur', sub); return KP.go('guide', true); }
  if (v === 'listing' && sub) { const s = KP.store.get('listing', {}); s.tab = sub; KP.store.set('listing', s); return KP.go('listing', true); }
  KP.go(v);
}
function addMsg(who, html, extra) {
  const m = h('div', { class: 'msg ' + who }); m.innerHTML = html; log.append(m);
  if (extra) log.append(extra);
  log.scrollTop = log.scrollHeight; return m;
}
function chips(list, action) { return h('div', { class: 'qr' }, list.map(x => h('button', { class: action ? 'act' : '', onclick: () => action ? doAction(x[1]) : send(x) }, action ? '→ ' + x[0] : x))); }
function botAnswer(e) {
  let html = md(e.a);
  if (e.src) html += `<div class="src">ที่มา: ${e.src.map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener">${KP.esc(l)}</a>`).join(' · ')}</div>`;
  const wrap = h('div', { style: 'display:flex;flex-direction:column;gap:6px' });
  if (e.go) wrap.append(chips(e.go, true));
  if (e.next) wrap.append(chips(e.next.map(id => (KP.KB.find(x => x.id === id) || {}).q).filter(Boolean)));
  addMsg('bot', html, wrap);
}
async function send(text) {
  text = String(text || '').trim(); if (!text) return;
  addMsg('me', KP.esc(text)); history.push({ role: 'user', content: text });
  const calc = calcIntent(text);
  if (calc && !KP.ai.ready()) { addMsg('bot', md(calc)); history.push({ role: 'assistant', content: calc }); return; }
  if (KP.ai.ready()) {
    const t = addMsg('bot', '<span class="typing"><i></i><i></i><i></i></span>');
    try {
      const msgs = history.slice(-12); const res = await KP.ai.ask(msgs, systemPrompt() + (calc ? `\n\nผลคำนวณจากแอป (ใช้ตัวเลขนี้):\n${calc}` : ''));
      t.innerHTML = md(res || '…'); history.push({ role: 'assistant', content: res }); log.scrollTop = log.scrollHeight; return;
    } catch (err) { t.innerHTML = md(`โหมด AI ใช้งานไม่ได้ (${err.message}) — ตอบจากฐานความรู้แทนครับ`); }
  }
  if (calc) { addMsg('bot', md(calc)); return; }
  const e = match(text);
  if (e) { botAnswer(e); history.push({ role: 'assistant', content: e.a }); return; }
  addMsg('bot', md('ยังไม่มีคำตอบตรงคำถามนี้ในฐานความรู้ ลองเลือกหัวข้อด้านล่าง หรือพิมพ์คำสำคัญ เช่น "etsy", "kdp", "payoneer", "ภาษี", "ราคา"\n\nถ้าต้องการคำตอบที่ยืดหยุ่นขึ้น เปิด **โหมด AI** ได้ที่ปุ่มเฟืองด้านบน'), chips(['เริ่มต้นยังไงดี', 'ค่าธรรมเนียม Etsy', 'KDP ตั้งราคาเท่าไหร่ดี', 'ทำอะไรขายดี', 'ขายในไทยยังไง', 'ต้องเสียภาษีไหม']));
}
KP.mountChat = () => {
  const btn = h('button', { id: 'chatBtn', 'aria-label': 'เปิดผู้ช่วย', html: KP.icon('chat') + '<span>ผู้ช่วย</span>', onclick: () => open() });
  const sub = h('small');
  updHead = () => { sub.textContent = KP.ai.ready() ? `โหมด AI · ${PROVIDERS[cfg.provider].name}` : 'ตอบจากฐานความรู้ · ตรวจสอบ พ.ย. 2026'; };
  log = h('div', { class: 'ch-log', role: 'log', 'aria-live': 'polite' });
  input = h('textarea', { 'aria-label': 'พิมพ์คำถาม', placeholder: 'ถามเรื่อง Etsy, KDP, Payoneer, ราคา…' });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); const v = input.value; input.value = ''; send(v); } });
  panel = h('section', { id: 'chat', 'aria-label': 'ผู้ช่วย' },
    h('div', { class: 'ch-h' }, h('div', { class: 'grow' }, h('b', null, 'ผู้ช่วย KidPrint'), sub), h('button', { class: 'btn icon', title: 'ตั้งค่า AI', 'aria-label': 'ตั้งค่า AI', html: KP.icon('key'), onclick: KP.openAISettings }), h('button', { class: 'btn icon', 'aria-label': 'ปิดผู้ช่วย', html: KP.icon('x'), onclick: () => close() })),
    log, h('div', { class: 'ch-in' }, input, h('button', { class: 'btn ink icon', 'aria-label': 'ส่ง', html: KP.icon('send'), onclick: () => { const v = input.value; input.value = ''; send(v); } })));
  document.body.append(btn, panel); updHead();
  addMsg('bot', md('สวัสดีครับ 👋 ผมช่วยเรื่อง **ทำสินค้า → ลงขาย → รับเงิน → ภาษี** ได้ทั้งหมด เลือกคำถามยอดฮิต หรือพิมพ์ถามได้เลย'), chips(SUGGEST));
  function open() { panel.classList.add('on'); btn.style.display = 'none'; setTimeout(() => input.focus(), 50); }
  function close() { panel.classList.remove('on'); btn.style.display = ''; btn.focus(); }
  KP.openChat = q => { open(); if (q) send(q); };
};
})();

/* =========================================================

(function () {
'use strict';
const KP = window.KP, h = KP.h;
const VIEWS = [
  ['home', 'เริ่ม', 'home', KP.mountHome],
  ['studio', 'สตูดิโอ', 'studio', KP.mountStudio],
  ['mockup', 'ภาพสินค้า', 'image', KP.mountMockup],
  ['listing', 'ลงขาย', 'tag', KP.mountListing],
  ['money', 'รายได้', 'coins', KP.mountMoney],
  ['guide', 'คู่มือ', 'book', KP.mountGuide]
];
const roots = {}, mounted = {};
KP.go = (v, force) => {
  if (!roots[v]) v = 'home';
  if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
  KP.currentView = v; document.body.dataset.view = v;
  Object.entries(roots).forEach(([k, el]) => el.classList.toggle('on', k === v));
  KP.$$('.rail a').forEach(a => { const on = a.dataset.v === v; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const def = VIEWS.find(x => x[0] === v);
  if (v === 'studio') { if (!mounted.studio) { def[3](roots.studio); mounted.studio = true; } else { KP.studioPreview && KP.studioPreview(); } }
  else if (force || !mounted[v] || v !== 'guide') { def[3](roots[v]); mounted[v] = true; }
  document.querySelector('main').scrollTop = 0;
  document.title = (v === 'home' ? '' : def[1] + ' · ') + 'KidPrint Studio';
};
function boot() {
  const rail = h('nav', { class: 'rail', 'aria-label': 'เมนูหลัก' });
  rail.append(h('div', { class: 'mark', title: 'KidPrint Studio', html: '<svg viewBox="0 0 44 44" width="40" height="40" aria-hidden="true"><rect x="3" y="3" width="38" height="38" rx="11" fill="#FFC93C"/><path d="M12 31l3.5-.8 13-13-2.7-2.7-13 13z" fill="#1C2340"/><path d="M27.3 13.1l2.7 2.7 2-2a1.9 1.9 0 000-2.7 1.9 1.9 0 00-2.7 0z" fill="#E5484D"/><path d="M12 31l.8-3.5 2.7 2.7z" fill="#fff"/></svg>' }));
  VIEWS.forEach(([v, label, ic]) => rail.append(h('a', { href: '#' + v, 'data-v': v, html: KP.icon(ic) + `<span>${label}</span>`, onclick: e => { e.preventDefault(); KP.go(v); } })));
  rail.append(h('div', { class: 'sp' }), h('button', { title: 'ตั้งค่าผู้ช่วย AI', html: KP.icon('key') + '<span>ตั้งค่า AI</span>', onclick: () => KP.openAISettings() }));
  const main = h('main', { id: 'main' });
  VIEWS.forEach(([v]) => { roots[v] = h('div', { class: 'view', id: 'view-' + v }); main.append(roots[v]); });
  document.body.prepend(h('div', { class: 'app' }, rail, main));
  KP.mountChat();
  const start = (location.hash || '').slice(1) || (KP.store.get('visited', false) ? 'studio' : 'home');
  KP.store.set('visited', true);
  KP.go(start);
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== KP.currentView) KP.go(v); });
  // re-render studio once web fonts arrive (text measurement depends on them)
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (KP.currentView === 'studio') KP.studioRefresh && KP.studioRefresh(); else if (KP.currentView === 'home') KP.go('home', true); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
